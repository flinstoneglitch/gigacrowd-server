<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGACROWD</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 5px;
      text-shadow: 3px 3px 0px #ff0055;
    }

    p {
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .btn-roar {
      padding: 24px 48px;
      font-size: 1.4rem;
      font-weight: 900;
      font-family: inherit;
      color: #0b0b0b;
      background-color: #00ffcc;
      border: 4px solid #fff;
      border-radius: 0px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #ff0055;
      transition: transform 0.05s;
    }

    .btn-roar:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0px #ff0055;
    }

    .btn-roar:disabled {
      cursor: default;
      opacity: 0.85;
    }

    #meter-bg {
      width: 260px;
      height: 16px;
      margin-top: 24px;
      background: #000;
      border: 2px solid #00ffcc;
      overflow: hidden;
    }

    #meter-fill {
      width: 0%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.08s ease-out;
    }

    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #fff;
      min-height: 1.2em;
    }

    #join-gate input {
      font-family: inherit;
      font-size: 1.4rem;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #00ffcc;
      background: #000;
      border: 4px solid #00ffcc;
      padding: 14px 18px;
      width: 220px;
      margin-bottom: 16px;
    }

    #join-gate input:focus {
      outline: none;
      border-color: #ff0055;
    }

    .btn-secondary {
      padding: 16px 32px;
      font-size: 1rem;
      font-weight: 900;
      font-family: inherit;
      color: #00ffcc;
      background: transparent;
      border: 3px solid #00ffcc;
      cursor: pointer;
    }

    #join-error {
      color: #ff0055;
      font-size: 0.8rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>

  <h1>GIGACROWD</h1>
  <p>[ LIVE BROADCAST GRID ]</p>

  <!-- Shown until a show room is known — either from a ?room= link/QR scan,
       or typed in here manually as a fallback. -->
  <div id="join-gate">
    <p style="margin-bottom: 8px;">[ SCAN YOUR HOST'S QR CODE TO JOIN ]</p>
    <form id="join-form">
      <input id="room-input" type="text" maxlength="6" placeholder="OR ENTER CODE" autocapitalize="characters" autocomplete="off" autocorrect="off" />
      <br>
      <button type="submit" class="btn-secondary">JOIN SHOW</button>
    </form>
    <div id="join-error"></div>
  </div>

  <!-- Shown once a show room is confirmed. -->
  <div id="roar-gate" hidden>
    <button id="start-btn" class="btn-roar">JOIN THE ROAR</button>
    <div id="meter-bg"><div id="meter-fill"></div></div>
    <div id="status">[ TAP TO GRANT MIC ACCESS ]</div>
  </div>

  <script src="vendor/socket.io.min.js"></script>
  <script src="config.js"></script>
  <script src="client.js"></script>
</body>
</html>
