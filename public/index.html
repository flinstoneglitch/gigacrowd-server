<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGAPHONE | MUSTARD</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 5px;
      text-shadow: 3px 3px 0px #ff0055;
    }

    p {
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .btn-roar {
      padding: 24px 48px;
      font-size: 1.4rem;
      font-weight: 900;
      font-family: inherit;
      color: #0b0b0b;
      background-color: #00ffcc;
      border: 4px solid #fff;
      border-radius: 0px;
      cursor: pointer;
      box-shadow: 6px 6px 0px #ff0055;
      transition: transform 0.05s;
    }

    .btn-roar:active {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0px #ff0055;
    }

    .btn-roar:disabled {
      cursor: default;
      opacity: 0.85;
    }

    #meter-bg {
      width: 260px;
      height: 16px;
      margin-top: 24px;
      background: #000;
      border: 2px solid #00ffcc;
      overflow: hidden;
    }

    #meter-fill {
      width: 0%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.08s ease-out;
    }

    #status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #fff;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <h1>GIGAPHONE</h1>
  <p>[ MUSTARD // LIVE BROADCAST GRID ]</p>
  <button id="start-btn" class="btn-roar">JOIN THE ROAR</button>

  <div id="meter-bg"><div id="meter-fill"></div></div>
  <div id="status">[ TAP TO GRANT MIC ACCESS ]</div>

  <script src="vendor/socket.io.min.js"></script>
  <script src="config.js"></script>
  <script src="client.js"></script>
</body>
</html>
