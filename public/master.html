<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GigaCrowd Broadcast Overlay</title>
  <style>
    html, body {
      background: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-transform: uppercase;
      user-select: none;
    }

    #visualizerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .energy-container {
      position: relative;
      z-index: 2;
      margin-top: auto;
      margin-bottom: 40px;
      text-align: center;
      background: rgba(11, 11, 11, 0.85);
      padding: 24px 32px;
      border: 4px solid #fff;
      box-shadow: 8px 8px 0px #ff0055;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .energy-bar-bg {
      width: 450px;
      height: 28px;
      background: #000;
      border: 2px solid #00ffcc;
      overflow: hidden;
    }

    .energy-bar-fill {
      width: 0%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.1s ease-out;
    }

    .metrics {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 15px;
      color: #fff;
    }

    .audio-notice {
      font-size: 0.75rem;
      color: #ff0055;
      margin-top: 8px;
    }

    .show-code-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(11, 11, 11, 0.85);
      border: 3px solid #fff;
      box-shadow: 5px 5px 0px #ff0055;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
    }

    .show-code-panel img {
      width: 72px;
      height: 72px;
      display: block;
      background: #fff;
      padding: 4px;
    }

    .show-code-label {
      font-size: 0.65rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .show-code-value {
      font-size: 1.4rem;
      font-weight: 900;
      color: #00ffcc;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <canvas id="visualizerCanvas"></canvas>

  <div class="energy-container" id="overlayContainer">
    <div class="energy-bar-bg">
      <div id="fill" class="energy-bar-fill"></div>
    </div>
    <div class="metrics">
      CROWD ENERGY: <span id="val">0</span>% | CROWD SIZE: <span id="count">0</span>
    </div>
    <div class="audio-notice" id="audioNotice">[ CLICK ANYWHERE TO UNMUTE SYNTHESIZED ROAR ]</div>
  </div>

  <div class="show-code-panel" id="showCodePanel" hidden>
    <img id="showCodeQr" alt="Scan to join this show" />
    <div class="show-code-text">
      <div class="show-code-label">SCAN TO JOIN THE ROAR</div>
      <div class="show-code-value" id="showCodeValue">------</div>
    </div>
  </div>

  <script src="vendor/socket.io.min.js"></script>
  <script src="config.js"></script>
  <script>
    const socket = io(window.GIGACROWD_SERVER_URL);
    const fill = document.getElementById('fill');
    const val = document.getElementById('val');
    const count = document.getElementById('count');
    const notice = document.getElementById('audioNotice');

    const showCodePanel = document.getElementById('showCodePanel');
    const showCodeQr = document.getElementById('showCodeQr');
    const showCodeValue = document.getElementById('showCodeValue');

    // Each overlay session is its own show (room). If this URL already names
    // one (?room=ABC123 — e.g. this source was reloaded), reclaim it so fans
    // already connected aren't dropped; otherwise start a fresh show and
    // display the code/QR fans scan to join it.
    function setupRoom() {
      const existingRoom = new URLSearchParams(window.location.search).get('room');

      if (existingRoom) {
        socket.emit('join-room', { roomId: existingRoom, role: 'master' }, (res) => {
          if (res && res.ok) {
            showCodeValue.innerText = existingRoom;
            if (res.qrDataUrl) showCodeQr.src = res.qrDataUrl;
            showCodePanel.hidden = false;
          } else {
            console.error('[GigaCrowd] Could not reclaim room, starting a new one:', res && res.error);
            createNewRoom();
          }
        });
      } else {
        createNewRoom();
      }
    }

    function createNewRoom() {
      socket.emit('create-room', {}, (res) => {
        if (!res || !res.roomId) {
          console.error('[GigaCrowd] Failed to create a show room.');
          return;
        }
        showCodeValue.innerText = res.roomId;
        if (res.qrDataUrl) showCodeQr.src = res.qrDataUrl;
        showCodePanel.hidden = false;

        // Bake the room into this page's own URL so an accidental reload of
        // this Browser Source reclaims the same show instead of starting a
        // brand new one and orphaning already-connected fans.
        const url = new URL(window.location.href);
        url.searchParams.set('room', res.roomId);
        window.history.replaceState({}, '', url);
      });
    }

    socket.on('connect', setupRoom);

    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let audioCtx, gainNode, filterNode, chatterGain, analyserNode;
    let dataArray, bufferLength;

    function makeNoiseBuffer(ctx) {
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    async function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- Roar body: two independently-random noise sources blended
        // together (not one), which builds up denser, broader-spectrum
        // energy the way an actual crowd rumble reads, instead of the
        // single-tone "wind through a vent" character one lowpass-filtered
        // noise source produces on its own. This is the continuous dull
        // roar that's always present, even at zero excitement — loudness
        // and brightness both scale up smoothly with crowd energy. ---
        const bodyA = audioCtx.createBufferSource();
        bodyA.buffer = makeNoiseBuffer(audioCtx);
        bodyA.loop = true;

        const bodyB = audioCtx.createBufferSource();
        bodyB.buffer = makeNoiseBuffer(audioCtx);
        bodyB.loop = true;

        filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(500, audioCtx.currentTime);

        const bodyFilterB = audioCtx.createBiquadFilter();
        bodyFilterB.type = 'lowpass';
        bodyFilterB.frequency.setValueAtTime(650, audioCtx.currentTime);

        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.22, audioCtx.currentTime); // audible dull roar at rest, not near-silent

        // Slow, aperiodic "breathing" in the roar's loudness — derived from
        // heavily-lowpassed noise (a random wander), not a fixed-rate sine
        // wave. A sine tremolo at a few Hz reads as a mechanical oscillation
        // (exactly the "wind fan" effect this replaces); noise-derived
        // wander has no fixed rate for the ear to lock onto, so it just
        // sounds like an organic crowd swelling and receding.
        const wanderSource = audioCtx.createBufferSource();
        wanderSource.buffer = makeNoiseBuffer(audioCtx);
        wanderSource.loop = true;
        const wanderFilter = audioCtx.createBiquadFilter();
        wanderFilter.type = 'lowpass';
        wanderFilter.frequency.setValueAtTime(0.4, audioCtx.currentTime);
        const wanderDepth = audioCtx.createGain();
        wanderDepth.gain.setValueAtTime(0.05, audioCtx.currentTime);
        wanderSource.connect(wanderFilter);
        wanderFilter.connect(wanderDepth);
        wanderDepth.connect(gainNode.gain);

        // --- Excitement layer: a brighter, denser band that's already
        // present in a small way at rest (no on/off cliff) and grows
        // continuously louder and busier as the crowd gets louder — this is
        // what turns "dull roar" into "crowd going off" as energy rises. ---
        const chatterNoise = audioCtx.createBufferSource();
        chatterNoise.buffer = makeNoiseBuffer(audioCtx);
        chatterNoise.loop = true;

        const chatterFilter = audioCtx.createBiquadFilter();
        chatterFilter.type = 'bandpass';
        chatterFilter.frequency.setValueAtTime(900, audioCtx.currentTime);
        chatterFilter.Q.setValueAtTime(0.5, audioCtx.currentTime);

        chatterGain = audioCtx.createGain();
        chatterGain.gain.setValueAtTime(0.03, audioCtx.currentTime);

        // Setup Analyser Node for Visualizer Canvas
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 128;
        bufferLength = analyserNode.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        // Chain: bodyA -> lowpass  -\
        //                            -> gain -\
        // bodyB -> lowpass(2)      -/           -> analyser -> destination
        // chatter -> bandpass -> chatterGain -/
        bodyA.connect(filterNode);
        bodyB.connect(bodyFilterB);
        filterNode.connect(gainNode);
        bodyFilterB.connect(gainNode);
        gainNode.connect(analyserNode);

        chatterNoise.connect(chatterFilter);
        chatterFilter.connect(chatterGain);
        chatterGain.connect(analyserNode);

        analyserNode.connect(audioCtx.destination);

        bodyA.start();
        bodyB.start();
        wanderSource.start();
        chatterNoise.start();
        drawVisualizer();
      }

      if (audioCtx.state === 'suspended') {
        try {
          await audioCtx.resume();
        } catch (err) {
          // Autoplay blocked — fall through and report the suspended state below.
        }
      }

      if (audioCtx.state === 'running') {
        notice.innerText = "[ HYBRID ROAR ACTIVE ]";
        notice.style.color = "#00ffcc";
      } else {
        // Most OBS/Streamlabs Browser Sources autoplay audio with no gesture
        // required, so this only shows up in a plain browser tab (or AV
        // software that enforces standard autoplay policy, e.g. some vMix/
        // XSplit builds) — one click anywhere on the overlay unlocks it.
        notice.innerText = "[ CLICK ANYWHERE TO ENABLE AMBIENT ROAR ]";
        notice.style.color = "#ff0055";
      }
    }

    document.addEventListener('click', initAudio);
    window.addEventListener('load', initAudio); // auto-start ambience where autoplay is allowed

    // Visualizer Canvas Loop
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!analyserNode) return;

      analyserNode.getByteFrequencyData(dataArray);

      // Fully clear each frame (not a translucent fill) — over a transparent
      // canvas, a translucent fill compounds toward opaque within ~1 second
      // and blacks out the video underneath in OBS/vMix/Streamlabs/XSplit.
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * (canvas.height * 0.45);
        
        // Dynamic color gradient shifting from teal to neon pink
        const r = Math.min(255, dataArray[i] + 50);
        const g = Math.max(0, 255 - dataArray[i] * 1.5);
        const b = 204;

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

        x += barWidth;
      }
    }

    // Telemetry Sync
    socket.on('crowdEnergy', (data) => {
      fill.style.width = data.totalEnergy + '%';
      val.innerText = data.totalEnergy;
      count.innerText = data.clientCount;

      if (gainNode && audioCtx && audioCtx.state === 'running') {
        const energy = data.totalEnergy / 100; // 0-1

        // Continuous curve, no on/off cliff: 0.22 is the audible "dull roar"
        // floor at rest, scaling smoothly up to a full crowd roar as energy
        // rises. Brightness (filter cutoff) rises alongside it.
        const rumbleVolume = 0.22 + energy * 0.55;
        const cutoffFreq = 500 + data.totalEnergy * 9;
        gainNode.gain.setTargetAtTime(rumbleVolume, audioCtx.currentTime, 0.2);
        filterNode.frequency.setTargetAtTime(cutoffFreq, audioCtx.currentTime, 0.2);

        if (chatterGain) {
          // Small but present even at rest, growing continuously (not a
          // threshold jump) — this is what makes a loud crowd sound like
          // "more people," not just "the same noise turned up."
          const chatterLevel = 0.03 + Math.pow(energy, 1.3) * 0.5;
          chatterGain.gain.setTargetAtTime(chatterLevel, audioCtx.currentTime, 0.2);
        }
      }
    });

    // v1 deliberately never plays real recorded voice clips — the ambient
    // roar layers above are the only audio output, driven purely by the
    // anonymous numeric crowdEnergy value. (Real cheer-clip playback was
    // prototyped and removed; see client.js's header note.)
  </script>
</body>
</html>
